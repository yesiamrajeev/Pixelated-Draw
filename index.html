<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelated Draw - Digital Pixel Art Creator</title>
    <meta name="description" content="Create stunning pixel art with our advanced digital drawing tool. Features include zoom controls, color picker, shapes, and more!">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./img/icon.png" type="image/png">
</head>

<body>
    <h1><span class="etch">Pixelated</span><span class="dash">-</span><span class="a">-</span><span
            class="dash">-</span><span class="sketch">Draw</span></h1>
    <div class="content">
        <div class="control-panel">
            <h2>Controls</h2>
            <div class="color">
                <label for="color-picker">Color:</label>
                <div class="color-inputs">
                    <input type="color" value="#ff0000" id="color-picker" />
                    <input type="text" id="hex-input" placeholder="#FF0000" maxlength="7" aria-label="Hex color input" value="#FF0000" />
                </div>
                <div class="color-palette" id="color-palette">
                    <div class="palette-color" data-color="#FF0000" style="background-color: #FF0000;" title="Red"></div>
                    <div class="palette-color" data-color="#00FF00" style="background-color: #00FF00;" title="Green"></div>
                    <div class="palette-color" data-color="#0000FF" style="background-color: #0000FF;" title="Blue"></div>
                    <div class="palette-color" data-color="#FFFF00" style="background-color: #FFFF00;" title="Yellow"></div>
                    <div class="palette-color" data-color="#FF00FF" style="background-color: #FF00FF;" title="Magenta"></div>
                    <div class="palette-color" data-color="#00FFFF" style="background-color: #00FFFF;" title="Cyan"></div>
                    <div class="palette-color" data-color="#000000" style="background-color: #000000;" title="Black"></div>
                    <div class="palette-color" data-color="#FFFFFF" style="background-color: #FFFFFF;" title="White"></div>
                </div>
            </div>
            <button class="rainbow">Rainbow mode</button>
            <button class="eraser">Eraser</button>
            <button class="clear">Clear</button>
            <div class="outline-section">
                <label for="outline-select">Outline:</label>
                <select id="outline-select">
                    <option value="none">None</option>
                    <option value="heart">Heart</option>
                    <option value="star">Star</option>
                    <option value="circle">Circle</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                </select>
            </div>
            <div class="grid-line">
                <label for="gridlines-toggle">Toggle Gridlines:</label>
                <input type="checkbox" id="gridlines-toggle" checked>
            </div>
            <div class="slider">
                <label for="box-slider"><span class="box-count">16</span>x<span class="box-count">16</span></label>
                <input type="range" min="1" max="100" value="16" id="box-slider">
            </div>
            <div class="zoom-controls">
                <label for="zoom-slider">Zoom: <span id="zoom-value">100%</span></label>
                <input type="range" min="50" max="200" value="100" id="zoom-slider" aria-label="Zoom level">
                <div class="zoom-buttons">
                    <button class="zoom-in" title="Zoom In" aria-label="Zoom In">+</button>
                    <button class="zoom-out" title="Zoom Out" aria-label="Zoom Out">-</button>
                    <button class="zoom-reset" title="Reset Zoom" aria-label="Reset Zoom">Reset</button>
                </div>
            </div>
            <div class="brush-size">
                <label for="brush-size-slider">Brush Size: <span id="brush-size-value">1</span></label>
                <input type="range" min="1" max="5" value="1" id="brush-size-slider" aria-label="Brush size">
            </div>
            <div class="extra-features">
                <button class="fill-bucket">Fill</button>
                <button class="download">Download</button>
                <button class="save-palette">Save Palette</button>
                <button class="help-btn">Help</button>
            </div>
        </div>
        <div class="drawing-area">
            <div class="grid"></div>
            <div class="tools-overlay">
                <button class="undo-btn" title="Undo (Ctrl+Z)">↶</button>
                <button class="redo-btn" title="Redo (Ctrl+Y)">↷</button>
            </div>
        </div>
    </div>
    <footer>
        <a href="https://github.com/yesiamrajeev"><img src="./img/github.svg" alt="gitHub logo"> @yesiamrajeev</a> | <a
            href="https://github.com/yesiamrajeev/Pixelated-Draw/">Source Code</a>
    </footer>
    
    <!-- Help Modal -->
    <div id="help-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Keyboard Shortcuts</h2>
            <div class="shortcuts-grid">
                <div class="shortcut-item">
                    <kbd>Ctrl + Z</kbd>
                    <span>Undo</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + Y</kbd>
                    <span>Redo</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + C</kbd>
                    <span>Clear Canvas</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + F</kbd>
                    <span>Toggle Fill Mode</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + D</kbd>
                    <span>Download</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + R</kbd>
                    <span>Rainbow Mode</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + E</kbd>
                    <span>Eraser</span>
                </div>
                <div class="shortcut-item">
                    <kbd>Ctrl + S</kbd>
                    <span>Save Color to Palette</span>
                </div>
                <div class="shortcut-item">
                    <kbd>1-5</kbd>
                    <span>Brush Size</span>
                </div>
                <div class="shortcut-item">
                    <kbd>+/-</kbd>
                    <span>Zoom In/Out</span>
                </div>
                <div class="shortcut-item">
                    <kbd>0</kbd>
                    <span>Reset Zoom</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
